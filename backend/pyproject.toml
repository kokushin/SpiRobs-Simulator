[project]
name = "spirob-mujoco"
version = "0.1.0"
description = "MuJoCo 3 physics backend for the SpiRob dynamics simulator"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
]

[project.scripts]
spirob-viewer = "spirob_mujoco.viewer:main"
spirob-server = "spirob_mujoco.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spirob_mujoco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
